name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  mysql-integration:
    name: Verify MySQL 8 before release
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: moegallery_test
          MYSQL_ROOT_PASSWORD: moegallery_ci_root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmoegallery_ci_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      AGMS_DATABASE_URL: mysql+pymysql://root:moegallery_ci_root@127.0.0.1:3306/moegallery_test?charset=utf8mb4
      AGMS_STORAGE_PATH: ${{ runner.temp }}/moegallery-mysql-storage
      AGMS_AUTH_SECRET: moegallery-ci-auth-secret-with-at-least-thirty-two-characters-20260804
      AGMS_API_KEYS: ci:agms_ci_api_key_with_at_least_thirty_two_characters_20260804
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MySQL client and backend test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client rsync
          python -m pip install --require-hashes -r backend/requirements-test.lock.txt

      - name: Run MySQL migrations and integration tests
        working-directory: backend
        run: |
          alembic upgrade head
          python -m unittest discover -s tests -p "test_mysql_integration.py" -v

      - name: Rehearse MySQL backup and restore
        run: python scripts/verify_backup_restore.py --database-url "$AGMS_DATABASE_URL" --allow-mysql

  package:
    name: Build and publish release package
    runs-on: ubuntu-latest
    needs: mysql-integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check backend syntax
        run: |
          python -m compileall backend/app backend/alembic scripts
          bash -n install.sh scripts/*.sh

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rsync

      - name: Install backend test dependencies
        run: |
          python -m pip install "pip==26.2" "pip-audit==2.10.1"
          python -m pip install --require-hashes -r backend/requirements-test.lock.txt

      - name: Audit backend dependencies
        run: python -m pip_audit --strict --require-hashes --disable-pip -r backend/requirements.lock.txt

      - name: Run backend tests
        env:
          AGMS_DATABASE_URL: sqlite:///${{ runner.temp }}/moegallery-ci.db
          AGMS_STORAGE_PATH: ${{ runner.temp }}/moegallery-storage
        working-directory: backend
        run: |
          alembic upgrade head
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Rehearse SQLite backup and restore
        run: python scripts/verify_backup_restore.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Release version must start with v and contain only letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package release archives
        run: python scripts/package_release.py --version "${{ steps.meta.outputs.version }}" --output-dir dist-release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          files=(dist-release/*.zip dist-release/*.tar.gz dist-release/SHA256SUMS.txt install.sh)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${files[@]}" --clobber
          else
            gh release create "$VERSION" "${files[@]}" \
              --title "MoeGallery $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
