name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rsync
      - name: Install backend test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-test.lock.txt
      - name: Check backend syntax and shell scripts
        run: |
          python -m compileall backend/app backend/alembic scripts
          bash -n install.sh scripts/*.sh
      - name: Run migrations and backend tests
        env:
          AGMS_DATABASE_URL: sqlite:///${{ runner.temp }}/moegallery-verify.db
          AGMS_STORAGE_PATH: ${{ runner.temp }}/moegallery-storage
          AGMS_AUTH_SECRET: moegallery-ci-auth-secret-with-at-least-thirty-two-characters-20260804
          AGMS_API_KEYS: ci:agms_ci_api_key_with_at_least_thirty_two_characters_20260804
        working-directory: backend
        run: |
          alembic upgrade head
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Rehearse SQLite backup and restore
        run: python scripts/verify_backup_restore.py

  backend-mysql:
    name: Backend (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: moegallery_test
          MYSQL_ROOT_PASSWORD: moegallery_ci_root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmoegallery_ci_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      AGMS_DATABASE_URL: mysql+pymysql://root:moegallery_ci_root@127.0.0.1:3306/moegallery_test?charset=utf8mb4
      AGMS_STORAGE_PATH: ${{ runner.temp }}/moegallery-mysql-storage
      AGMS_AUTH_SECRET: moegallery-ci-auth-secret-with-at-least-thirty-two-characters-20260804
      AGMS_API_KEYS: ci:agms_ci_api_key_with_at_least_thirty_two_characters_20260804
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MySQL client and backend test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client rsync
          python -m pip install --require-hashes -r backend/requirements-test.lock.txt
      - name: Run MySQL migrations and integration tests
        working-directory: backend
        run: |
          alembic upgrade head
          python -m unittest discover -s tests -p "test_mysql_integration.py" -v
      - name: Rehearse MySQL backup and restore
        run: python scripts/verify_backup_restore.py --database-url "$AGMS_DATABASE_URL" --allow-mysql

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs:
      - backend-sqlite
      - backend-mysql
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-test.lock.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
